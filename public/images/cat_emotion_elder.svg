<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="emoBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDF2F8" />
      <stop offset="100%" stop-color="#FCE7F3" />
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#emoBg)" rx="16" />
  <g transform="translate(60, 40)">
    <!-- Music & Memories Visual -->
    <circle cx="140" cy="90" r="70" fill="#FBCFE8" opacity="0.6" />
    <circle cx="140" cy="90" r="45" fill="#EC4899" />
    <text x="140" y="102" font-family="sans-serif" font-size="34" text-anchor="middle" fill="#FFFFFF">❤️</text>
    
    <!-- Floating Musical Notes -->
    <text x="60" y="60" font-family="sans-serif" font-size="24">🎵</text>
    <text x="210" y="50" font-family="sans-serif" font-size="24">🎶</text>
    <text x="70" y="140" font-family="sans-serif" font-size="20">🌸</text>
    <text x="200" y="140" font-family="sans-serif" font-size="20">✨</text>
  </g>
</svg>
