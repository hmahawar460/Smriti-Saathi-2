<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Left Navy Gradient -->
    <linearGradient id="svgLeftHemisphere" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#001F54" />
      <stop offset="60%" stop-color="#002D72" />
      <stop offset="100%" stop-color="#003F88" />
    </linearGradient>

    <!-- Right Blue Gradient -->
    <linearGradient id="svgRightHemisphere" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0077B6" />
      <stop offset="50%" stop-color="#0096C7" />
      <stop offset="100%" stop-color="#00B4D8" />
    </linearGradient>

    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#001F54" flood-opacity="0.15" />
    </filter>
  </defs>

  <g id="logo-icon" filter="url(#softShadow)">
    <!-- LEFT HEMISPHERE (NAVY) -->
    <g fill="url(#svgLeftHemisphere)">
      <!-- Multi-lobed brain outer contour -->
      <path d="M 235 95 
               C 215 92, 195 98, 180 115 
               C 155 110, 130 130, 125 155 
               C 105 165, 95 195, 105 220 
               C 92 238, 95 270, 110 290 
               C 105 315, 125 345, 155 355 
               C 185 365, 215 350, 235 330 
               L 235 285 
               L 190 285 
               L 190 215 
               L 235 215 
               Z" />
      
      <!-- Circuit grooves and terminal node dots (White) -->
      <!-- Groove 1: Upper frontal lobe -->
      <path d="M 160 170 C 185 170, 205 145, 215 125" fill="none" stroke="#FFFFFF" stroke-width="7.5" stroke-linecap="round" />
      <circle cx="160" cy="170" r="6.5" fill="#FFFFFF" />
      
      <!-- Groove 2: Mid parietal lobe -->
      <path d="M 135 230 C 160 230, 185 210, 195 200" fill="none" stroke="#FFFFFF" stroke-width="7.5" stroke-linecap="round" />
      <circle cx="135" cy="230" r="6.5" fill="#FFFFFF" />
      
      <!-- Groove 3: Lower occipital/temporal lobe -->
      <path d="M 145 295 C 170 295, 195 310, 215 320" fill="none" stroke="#FFFFFF" stroke-width="7.5" stroke-linecap="round" />
      <circle cx="145" cy="295" r="6.5" fill="#FFFFFF" />

      <!-- Peripheral node dots (White) -->
      <circle cx="120" cy="180" r="5" fill="#FFFFFF" />
      <circle cx="115" cy="260" r="5" fill="#FFFFFF" />
      <circle cx="180" cy="340" r="5" fill="#FFFFFF" />

      <!-- Subtle lower accent arc -->
      <path d="M 125 310 C 135 325, 150 330, 160 330" fill="none" stroke="#64748B" stroke-width="5" stroke-linecap="round" opacity="0.6" />
    </g>

    <!-- RIGHT HEMISPHERE (VIBRANT SKY BLUE) -->
    <g fill="url(#svgRightHemisphere)">
      <!-- Multi-lobed brain outer contour -->
      <path d="M 265 95 
               C 285 92, 305 98, 320 115 
               C 345 110, 370 130, 375 155 
               C 395 165, 405 195, 395 220 
               C 408 238, 405 270, 390 290 
               C 395 315, 375 345, 345 355 
               C 315 365, 285 350, 265 330 
               L 265 285 
               L 310 285 
               L 310 215 
               L 265 215 
               Z" />

      <!-- Circuit grooves and terminal node dots (White) -->
      <!-- Groove 1: Upper frontal lobe -->
      <path d="M 340 170 C 315 170, 295 145, 285 125" fill="none" stroke="#FFFFFF" stroke-width="7.5" stroke-linecap="round" />
      <circle cx="340" cy="170" r="6.5" fill="#FFFFFF" />

      <!-- Groove 2: Mid parietal lobe -->
      <path d="M 365 230 C 340 230, 315 210, 305 200" fill="none" stroke="#FFFFFF" stroke-width="7.5" stroke-linecap="round" />
      <circle cx="365" cy="230" r="6.5" fill="#FFFFFF" />

      <!-- Groove 3: Lower occipital/temporal lobe -->
      <path d="M 355 295 C 330 295, 305 310, 285 320" fill="none" stroke="#FFFFFF" stroke-width="7.5" stroke-linecap="round" />
      <circle cx="355" cy="295" r="6.5" fill="#FFFFFF" />

      <!-- Peripheral node dots (White) -->
      <circle cx="380" cy="180" r="5" fill="#FFFFFF" />
      <circle cx="385" cy="260" r="5" fill="#FFFFFF" />
      <circle cx="320" cy="340" r="5" fill="#FFFFFF" />

      <!-- Subtle lower accent arc -->
      <path d="M 375 310 C 365 325, 350 330, 340 330" fill="none" stroke="#94A3B8" stroke-width="5" stroke-linecap="round" opacity="0.6" />
    </g>

    <!-- CENTER MEDICAL PLUS CROSS (PURE WHITE WITH ROUNDED CAPS) -->
    <g fill="#FFFFFF">
      <rect x="233" y="170" width="34" height="160" rx="17" />
      <rect x="170" y="233" width="160" height="34" rx="17" />
    </g>
  </g>

  <!-- SMRITI SATHI SERIF TEXT -->
  <text 
    x="250" 
    y="445" 
    font-family="'Playfair Display', 'Times New Roman', 'Georgia', serif" 
    font-size="44" 
    font-weight="700" 
    letter-spacing="4" 
    fill="#001F54" 
    text-anchor="middle"
  >
    SMRITI SATHI
  </text>
</svg>
