<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="attBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFBEB" />
      <stop offset="100%" stop-color="#FEF3C7" />
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#attBg)" rx="16" />
  <g transform="translate(60, 40)">
    <!-- Concentric Target circles for attention -->
    <circle cx="140" cy="110" r="90" fill="#FDE68A" opacity="0.4" />
    <circle cx="140" cy="110" r="65" fill="#F59E0B" opacity="0.6" />
    <circle cx="140" cy="110" r="40" fill="#D97706" />
    <circle cx="140" cy="110" r="16" fill="#FFFFFF" />
    <!-- Attention Color circles -->
    <circle cx="50" cy="60" r="24" fill="#EF4444" stroke="#FFFFFF" stroke-width="3" />
    <text x="50" y="66" font-family="sans-serif" font-size="14" text-anchor="middle" fill="#FFFFFF">🔴</text>
    <circle cx="230" cy="50" r="24" fill="#3B82F6" stroke="#FFFFFF" stroke-width="3" />
    <text x="230" y="56" font-family="sans-serif" font-size="14" text-anchor="middle" fill="#FFFFFF">🔵</text>
    <circle cx="230" cy="160" r="24" fill="#10B981" stroke="#FFFFFF" stroke-width="3" />
    <text x="230" y="166" font-family="sans-serif" font-size="14" text-anchor="middle" fill="#FFFFFF">🟢</text>
  </g>
</svg>
