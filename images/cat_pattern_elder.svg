<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="patBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5F3FF" />
      <stop offset="100%" stop-color="#EDE9FE" />
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#patBg)" rx="16" />
  <g transform="translate(60, 40)">
    <!-- Geometric Pattern Grid -->
    <rect x="20" y="20" width="60" height="60" rx="12" fill="#7C3AED" />
    <text x="50" y="58" font-family="sans-serif" font-size="24" text-anchor="middle" fill="#FFFFFF">🔷</text>
    <rect x="90" y="20" width="60" height="60" rx="12" fill="#8B5CF6" />
    <text x="120" y="58" font-family="sans-serif" font-size="24" text-anchor="middle" fill="#FFFFFF">🔶</text>
    <rect x="160" y="20" width="60" height="60" rx="12" fill="#7C3AED" />
    <text x="190" y="58" font-family="sans-serif" font-size="24" text-anchor="middle" fill="#FFFFFF">🔷</text>
    <rect x="230" y="20" width="60" height="60" rx="12" fill="#DDD6FE" stroke="#7C3AED" stroke-width="2" stroke-dasharray="4 4" />
    <text x="260" y="58" font-family="sans-serif" font-size="24" text-anchor="middle" fill="#7C3AED">❓</text>

    <!-- Sequence Solution Bar -->
    <rect x="40" y="110" width="230" height="48" rx="14" fill="#FFFFFF" stroke="#C4B5FD" stroke-width="1.5" />
    <text x="155" y="140" font-family="sans-serif" font-weight="bold" font-size="13" text-anchor="middle" fill="#6D28D9">Next in Sequence: 🔶</text>
  </g>
